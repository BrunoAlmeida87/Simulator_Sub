# Integração contínua: testes de validação física + build + publicação no GitHub Pages.
name: Testes e publicação (GitHub Pages)

# Push na main: testes + build + publicação. Pull request para a main: só testes + build.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Testes (validação física)
        run: npm test
      - name: Build de produção
        run: npm run build
      - name: Publicar no branch gh-pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Publicação automática do simulador'
