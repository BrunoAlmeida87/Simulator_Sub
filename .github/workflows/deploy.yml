# Integração contínua: testes de validação física + build + publicação no GitHub Pages.
name: Testes e publicação (GitHub Pages)

on:
  push:
    branches: [main, master, ccr-9b9ce051-of6ev1]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Testes (validação física)
        run: npm test
      - name: Build de produção
        run: npm run build
      - name: Publicar no branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Publicação automática do simulador'
